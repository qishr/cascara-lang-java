plugins {
    id "java-library"
    id "io.github.qishr.cascara.conventions" version "0.1.0"
    id "io.github.qishr.cascara.publish" version "0.1.1"
}


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}


repositories {
	mavenLocal()
	mavenCentral()
}


dependencies {
    implementation(platform("io.github.qishr:cascara-meta-bom:$cascara_version"))

    // JUnit
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Mockito
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'

    // Cascara
    implementation "io.github.qishr:cascara-common"
    // implementation "io.github.qishr:cascara-common-io"
}
